name: CI/CD DevSecOps

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, build y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Las pruebas de integración corren contra un MongoDB real y desechable
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Auditoría de dependencias (solo producción, severidad alta)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (falla con hallazgos de severidad ERROR)
        run: semgrep scan --config p/javascript --config p/typescript --config p/nodejs --config p/react --config p/secrets --severity ERROR --error --exclude datos

  secretos:
    name: Detección de secretos - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --no-git --redact -v

  imagen:
    name: Imagen Docker del backend
    needs: [backend, frontend, sast, secretos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t inpe-devsecops-backend:${{ github.sha }} backend

  # Despliegue continuo con Deploy Hooks de Render (secretos de GitHub, nunca en el repositorio).
  # 4 servicios: API y frontend en Desarrollo y en Producción. En Render, Auto-Deploy debe estar apagado:
  # solo despliega el pipeline, y solo si todo lo anterior pasó.
  deploy-dev:
    name: Despliegue a Desarrollo (Render)
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: desarrollo
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
      HOOK_FRONT: ${{ secrets.RENDER_DEPLOY_HOOK_FRONT_DEV }}
      URL_API: ${{ vars.DEV_URL }}
      URL_FRONT: ${{ vars.FRONT_DEV_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Disparar despliegue de la API y del frontend
        run: |
          if [ -n "$HOOK_API" ]; then curl -fsS -X POST "$HOOK_API" > /dev/null; else echo "::warning::RENDER_DEPLOY_HOOK_DEV no configurado: la API de Desarrollo no se despliega"; fi
          if [ -n "$HOOK_FRONT" ]; then curl -fsS -X POST "$HOOK_FRONT" > /dev/null; else echo "::warning::RENDER_DEPLOY_HOOK_FRONT_DEV no configurado: el frontend de Desarrollo no se despliega"; fi
      # Smoke test: la API y la página real deben responder con el commit recién mergeado; si no, se corta aquí
      - name: Smoke test de la API
        if: env.URL_API != ''
        run: bash scripts/smoke-test.sh api "$URL_API" "$GITHUB_SHA"
      - name: Smoke test del frontend
        if: env.URL_FRONT != ''
        run: bash scripts/smoke-test.sh front "$URL_FRONT" "$GITHUB_SHA"
      - name: Avisar si falta configuración
        if: env.URL_API == '' || env.URL_FRONT == ''
        run: |
          echo "::warning::Faltan DEV_URL o FRONT_DEV_URL: el smoke test de Desarrollo está incompleto"

  dast:
    name: DAST - OWASP ZAP (baseline sobre DEV)
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline
        if: vars.DEV_URL != ''
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.DEV_URL }}
          rules_file_name: .zap/reglas.tsv
          fail_action: true
          allow_issue_writing: false

  deploy-prod:
    name: Despliegue a Producción (Render)
    needs: dast
    if: vars.DEV_URL != ''
    runs-on: ubuntu-latest
    environment: produccion
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
      HOOK_FRONT: ${{ secrets.RENDER_DEPLOY_HOOK_FRONT_PROD }}
      URL_API: ${{ vars.PROD_URL }}
      URL_FRONT: ${{ vars.FRONT_PROD_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Disparar despliegue de la API y del frontend
        run: |
          if [ -n "$HOOK_API" ]; then curl -fsS -X POST "$HOOK_API" > /dev/null; else echo "::warning::RENDER_DEPLOY_HOOK_PROD no configurado: la API de Producción no se despliega"; fi
          if [ -n "$HOOK_FRONT" ]; then curl -fsS -X POST "$HOOK_FRONT" > /dev/null; else echo "::warning::RENDER_DEPLOY_HOOK_FRONT_PROD no configurado: el frontend de Producción no se despliega"; fi
      - name: Smoke test de la API
        if: env.URL_API != ''
        run: bash scripts/smoke-test.sh api "$URL_API" "$GITHUB_SHA"
      - name: Smoke test del frontend
        if: env.URL_FRONT != ''
        run: bash scripts/smoke-test.sh front "$URL_FRONT" "$GITHUB_SHA"
      - name: Avisar si falta configuración
        if: env.URL_API == '' || env.URL_FRONT == ''
        run: |
          echo "::warning::Faltan PROD_URL o FRONT_PROD_URL: el smoke test de Producción está incompleto"
